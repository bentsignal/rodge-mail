name: Mobile fingerprint

# Does this PR change native code (anything in the native fingerprint)? If
# so, the phone only gets it from a new local EAS build, and every
# simulator dev client is rebuilt for it, so the PR gets the
# "📱 Native Change" label and a summary of what changed, and its
# description's "Native change:" line can't say "no". Rodge has no
# expo-updates, so fingerprints come from Expo's own CLI
# (`expo/bin/fingerprint`, @expo/fingerprint). Both come from this one job
# on one OS, so they compare cleanly (fingerprints differ between macOS and
# Linux).
on:
  pull_request:
    # Edited: the description's "Native change:" line is checked here too.
    types: [opened, edited, reopened, synchronize]
    paths:
      - apps/mobile/**
      - shared/**
      - patches/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/mobile-fingerprint.yml

concurrency:
  group: mobile-fingerprint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The default checkout is the merge result, which is what main
          # would become.
          fetch-depth: 0

      - name: Setup
        uses: ./tooling/github/setup

      - name: Fingerprint the merge result
        working-directory: apps/mobile
        run: |
          mkdir -p "$RUNNER_TEMP/fp/head" "$RUNNER_TEMP/fp/base"
          for platform in ios android; do
            pnpm exec fingerprint fingerprint:generate --platform "$platform" > "$RUNNER_TEMP/fp/head/$platform.json"
          done

      - name: Fingerprint the base
        run: |
          git checkout --quiet "${{ github.event.pull_request.base.sha }}"
          pnpm install --frozen-lockfile
          cd apps/mobile
          for platform in ios android; do
            pnpm exec fingerprint fingerprint:generate --platform "$platform" > "$RUNNER_TEMP/fp/base/$platform.json"
          done

      - id: compare
        name: Compare
        run: |
          changed=""
          {
            echo "## Native fingerprint"
            echo
            for platform in ios android; do
              head_hash="$(jq -r .hash "$RUNNER_TEMP/fp/head/$platform.json")"
              base_hash="$(jq -r .hash "$RUNNER_TEMP/fp/base/$platform.json")"
              if [ "$head_hash" = "$base_hash" ]; then
                echo "- ✅ **$platform** unchanged"
                continue
              fi
              changed="$changed $platform"
              echo "- 📱 **$platform** changed: needs a new local EAS build on the phone"
              jq -r -n \
                --slurpfile h "$RUNNER_TEMP/fp/head/$platform.json" \
                --slurpfile b "$RUNNER_TEMP/fp/base/$platform.json" '
                  ($b[0].sources | map({ (.filePath // .id): .hash }) | add // {}) as $bm
                  | $h[0].sources[]
                  | select($bm[(.filePath // .id)] != .hash)
                  | "  - \(.type): `\(.filePath // .id)`"'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "changed=${changed# }" >> "$GITHUB_OUTPUT"

      - name: Label
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.compare.outputs.changed }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          label="📱 Native Change"
          gh label create "$label" --color d93f0b --force \
            --description "Changes native code; the phone needs a new local EAS build" \
            --repo "$GITHUB_REPOSITORY"
          if [ -n "$CHANGED" ]; then
            gh pr edit "$PR" --add-label "$label" --repo "$GITHUB_REPOSITORY"
          else
            gh pr edit "$PR" --remove-label "$label" --repo "$GITHUB_REPOSITORY" || true
          fi

      - name: Check the description's Native change line
        if: ${{ steps.compare.outputs.changed != '' }}
        env:
          CHANGED: ${{ steps.compare.outputs.changed }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          line="$(printf '%s\n' "$PR_BODY" | tr -d '\r' | grep -iE '^\s*-\s*Native change:' | head -1 \
            | sed -E 's/<!--.*-->//g; s/^[^:]*:[[:space:]]*//')"
          if printf '%s' "$line" | grep -qiE '^no\b' || [ -z "$line" ]; then
            echo "::error::This PR changes the native fingerprint ($CHANGED), so \"Native change:\" can't say no. Say \"yes\" and what changed; the release builds and installs a new IPA (docs/releasing.md)."
            exit 1
          fi
          echo "native change: $line"
